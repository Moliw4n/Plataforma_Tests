<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0b1226">
<title>Kiron · Directo (profesor)</title>
<link rel="stylesheet" href="css/estilo.css">
<link rel="stylesheet" href="css/panel.css">
<link rel="stylesheet" href="css/directo.css">
<link rel="icon" href="img/favicon.png">
</head>
<body>
<header class="top">
  <div class="marca"><svg class="logo-kiron" role="img" aria-label="Kiron"><use href="img/logo-kiron.svg#logo"/></svg> <span>· DIRECTO</span></div>
  <span class="espacio-top"></span>
  <button class="btn" id="bPantalla" hidden title="Pantalla completa" aria-label="Pantalla completa">⛶</button>
  <div class="usuario" id="usuario" hidden></div>
</header>

<main class="panel directo" id="app"><div class="cargando">Cargando…</div></main>

<div class="dialogo-fondo" id="dialogo" hidden>
  <div class="dialogo" role="alertdialog" aria-modal="true" aria-labelledby="dlgTexto">
    <p id="dlgTexto"></p>
    <div class="acciones"><button class="btn" id="dlgNo">Cancelar</button><button class="btn peligro" id="dlgSi">Cerrar la sala</button></div>
  </div>
</div>

<script src="js/config.js"></script>
<script type="module" src="js/directo.js"></script>
</body>
</html>
