<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0b1226">
<title>Kairos · Panel del profesor</title>
<link rel="stylesheet" href="css/estilo.css">
<link rel="stylesheet" href="css/panel.css">
<link rel="manifest" href="panel.webmanifest">
<link rel="icon" href="img/favicon.png">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kairos">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body>
<header class="top">
  <div class="marca"><svg class="logo-kairos" viewBox="0 0 264 73" role="img" aria-label="Kairos"><use href="img/logo-kairos.svg#k"/><text x="88" y="72.4" font-family="Orbitron, sans-serif" font-weight="800" font-size="50" letter-spacing="6" fill="#eef2fb">AIROS</text></svg> <span>· PANEL DEL PROFESOR</span></div>
  <span class="espacio-top"></span>
  <div class="usuario" id="usuario" hidden></div>
</header>

<main class="panel" id="app"><div class="cargando">Cargando…</div></main>

<div class="capa" id="capaDetalle" role="dialog" aria-modal="true" aria-label="Detalle del alumno">
  <div class="chuleta detalle">
    <div class="cab"><h2 id="tituloDetalle">ALUMNO</h2><button class="cerrar" id="bCerrarDetalle" aria-label="Cerrar">✕</button></div>
    <div class="cuerpo" id="cuerpoDetalle"></div>
  </div>
</div>

<div class="dialogo-fondo" id="dialogo" hidden>
  <div class="dialogo" role="alertdialog" aria-modal="true" aria-labelledby="dlgTexto">
    <p id="dlgTexto"></p>
    <div class="acciones"><button class="btn" id="dlgNo">Cancelar</button><button class="btn peligro" id="dlgSi">Borrar</button></div>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/panel.js"></script>
</body>
</html>
