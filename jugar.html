<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1226">
<title>Kiron · IES Santa Bárbara</title>
<link rel="stylesheet" href="css/estilo.css">
<link rel="icon" href="img/favicon.png">
</head>
<body>
<header class="top">
  <div class="marca" id="marca"><svg class="logo-kiron" role="img" aria-label="Kiron"><use href="img/logo-kiron.svg#logo"/></svg></div>
  <div class="barra" id="barra" aria-hidden="true"></div>
  <div class="contador" id="contador"></div>
  <div class="reloj" id="reloj" hidden></div>
  <button class="btn-chuleta" id="bChuleta" hidden title="Abrir la chuleta (C)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h11l5 5v11H4z"/><path d="M15 4v5h5M8 13h8M8 17h5"/></svg>
    CHULETA
  </button>
</header>

<main class="escena" id="escena"><div class="cargando">Cargando el test…</div></main>

<footer class="bot" id="bot" hidden>
  <button class="btn" id="bAnt" aria-label="Pregunta anterior">←</button>
  <span class="pista" id="pista">Pulsa una opción (o las teclas 1-4)</span>
  <span class="espacio"></span>
  <button class="btn pri" id="bSig" disabled>Siguiente →</button>
</footer>

<div class="capa" id="capaChuleta" role="dialog" aria-modal="true" aria-label="Chuleta">
  <div class="chuleta">
    <div class="cab"><h2 id="tituloChuleta">CHULETA</h2><button class="cerrar" id="bCerrarChuleta" aria-label="Cerrar la chuleta">✕</button></div>
    <nav class="pestanas" id="pestanas"></nav>
    <div class="cuerpo" id="cuerpoChuleta"></div>
  </div>
</div>

<script>window.TEST_POR_DEFECTO = "tda2-u1-python-practica";</script>
<script src="js/config.js"></script>
<script type="module" src="js/jugar.js"></script>
</body>
</html>
